<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B14"/>
      <stop offset="100%" stop-color="#14131F"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>

  <!-- pipeline: Research -> Analysis -> UI-Decision -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif">
    <line x1="128" y1="72" x2="320" y2="72" stroke="url(#line)" stroke-width="2"/>
    <line x1="320" y1="72" x2="512" y2="72" stroke="url(#line)" stroke-width="2"/>

    <circle cx="128" cy="72" r="26" fill="#15131F" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="128" cy="72" r="6" fill="#818CF8"/>
    <text x="128" y="116" fill="#A1A1AA" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.04em">RESEARCH</text>

    <circle cx="320" cy="72" r="26" fill="#15131F" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="320" cy="72" r="6" fill="#818CF8"/>
    <text x="320" y="116" fill="#A1A1AA" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.04em">ANALYSIS</text>

    <circle cx="512" cy="72" r="26" fill="#15131F" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="512" cy="72" r="6" fill="#818CF8"/>
    <text x="512" y="116" fill="#A1A1AA" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.04em">UI-DECISION</text>
  </g>

  <!-- generated output: bar chart card -->
  <g transform="translate(72,168)">
    <rect width="220" height="176" rx="14" fill="#15131F" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="20" y="30" fill="#FAFAFA" font-family="'Plus Jakarta Sans'" font-size="13" font-weight="700">Financial Health</text>
    <text x="20" y="48" fill="#71717A" font-family="'Plus Jakarta Sans'" font-size="10">Signal composite</text>
    <rect x="24" y="76" width="18" height="70" rx="3" fill="url(#bar1)" opacity="0.55"/>
    <rect x="54" y="60" width="18" height="86" rx="3" fill="url(#bar1)" opacity="0.7"/>
    <rect x="84" y="42" width="18" height="104" rx="3" fill="url(#bar1)" opacity="0.85"/>
    <rect x="114" y="90" width="18" height="56" rx="3" fill="url(#bar1)" opacity="0.6"/>
    <rect x="144" y="30" width="18" height="116" rx="3" fill="url(#bar1)"/>
    <rect x="174" y="66" width="18" height="80" rx="3" fill="url(#bar1)" opacity="0.75"/>
    <line x1="20" y1="146" x2="200" y2="146" stroke="#FFFFFF" stroke-opacity="0.12"/>
  </g>

  <!-- generated output: metric card -->
  <g transform="translate(316,168)">
    <rect width="252" height="176" rx="14" fill="#15131F" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="20" y="30" fill="#FAFAFA" font-family="'Plus Jakarta Sans'" font-size="13" font-weight="700">Liquidity Ratio</text>
    <text x="232" y="30" fill="#4ADE80" font-family="'Plus Jakarta Sans'" font-size="11" font-weight="700" text-anchor="end">Strong</text>
    <text x="20" y="66" fill="#FAFAFA" font-family="'Plus Jakarta Sans'" font-size="30" font-weight="700">2.14x</text>
    <path d="M20 92 L 60 84 L 100 96 L 140 78 L 180 82 L 220 66" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="220" cy="66" r="4" fill="#818CF8"/>
    <line x1="20" y1="120" x2="232" y2="120" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="20" y="132" width="150" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.06"/>
    <text x="20" y="164" fill="#71717A" font-family="'Plus Jakarta Sans'" font-size="9" letter-spacing="0.03em">SOURCE · SEC EDGAR — LIVE</text>
  </g>
</svg>
