<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#110c1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#863bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#863bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#47bfff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#47bfff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- SN. logo mark -->
  <rect x="72" y="64" width="72" height="72" rx="14" fill="#1a1a1a"/>
  <text x="82" y="119" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="44" fill="#ffffff" letter-spacing="-1.5">SN</text>
  <circle cx="152" cy="117" r="7" fill="#863bff"/>

  <!-- Divider line -->
  <rect x="72" y="184" width="80" height="2" rx="1" fill="#863bff" opacity="0.7"/>

  <!-- Name -->
  <text x="72" y="310" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="72" fill="#ffffff" letter-spacing="-3">Shashidhara</text>
  <text x="72" y="392" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="72" fill="#ffffff" letter-spacing="-3">Narayanappa</text>

  <!-- Role -->
  <text x="72" y="454" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="400" font-size="28" fill="rgba(255,255,255,0.45)" letter-spacing="-0.5">UX Researcher &amp; Product Designer</text>

  <!-- Tags -->
  <rect x="72" y="494" width="116" height="38" rx="19" fill="rgba(134,59,255,0.2)"/>
  <text x="130" y="518" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="#863bff" text-anchor="middle">Research</text>

  <rect x="202" y="494" width="98" height="38" rx="19" fill="rgba(255,255,255,0.06)"/>
  <text x="251" y="518" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">Design</text>

  <rect x="314" y="494" width="130" height="38" rx="19" fill="rgba(255,255,255,0.06)"/>
  <text x="379" y="518" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">Engineering</text>

  <!-- Domain -->
  <text x="1128" y="580" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" fill="rgba(255,255,255,0.25)" text-anchor="end">portfolio-shashi-five.vercel.app</text>
</svg>
